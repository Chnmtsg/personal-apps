<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the app can paint under a phone's rounded corners
         and notch; the safe-area insets are honoured in app.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Where Am I</title>
    <meta name="description" content="A goal tracker that refuses to store a goal until it has been turned into numbers." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15151a" />
  </head>
  <body>
    <!-- The router replaces this node's children on every navigation. tabindex
         makes it focusable so focus can be moved here after a route change. -->
    <div id="app" tabindex="-1"></div>
    <noscript>Where Am I does its arithmetic in the browser, so it needs JavaScript switched on.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

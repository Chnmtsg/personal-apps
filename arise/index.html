<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The app's first constraint — no network calls, ever — enforced by the
     browser instead of by review. It lived in `_headers` until the app moved to
     GitHub Pages, which ignores that file, so it moved here.

     This is the one exception to "nothing is inlined into the shell": a meta tag
     is not a script, and the alternative is no enforcement at all. It must stay
     ABOVE the manifest, icon and stylesheet links below — a policy declared
     after a resource does not govern it. tools/package.js checks that, and
     checks that none of the directives has gone missing.

     Two things cannot be carried in a meta tag: `frame-ancestors` and
     `X-Frame-Options` are both ignored here, so clickjacking protection is a
     real thing lost in the move to Pages and needs a host that sends headers.

     Every value below is load-bearing. `style-src` needs 'unsafe-inline' for
     style *attributes* only (`style="--hue:32"` on a goal card) — there is no
     inline <style> anywhere. `img-src` needs `data:` for exercise pictures,
     which are stored and drawn as data URLs. Dropping either breaks a screen
     that works today. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline — Personal Development Tracker</title>
<meta name="description" content="Set goals that progress from where you actually are to a target you choose, keep the streak, and write before you can call the reading done.">
<meta name="theme-color" content="#100e0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discipline">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">↑</span>
    <span class="brand-text">Discipline</span>
  </div>
  <div class="topbar-right">
    <!-- The label lives on the button, not the contents: render() rewrites the
         innerHTML of both chips, so a name inside them would not survive. -->
    <button class="chip streak-chip" id="streakChip" type="button" data-nav="progress" aria-label="Current streak">
      <i aria-hidden="true">STREAK</i><b>0</b>
    </button>
    <!-- Days kept, not a rank. The top bar is permanent view, so it carries a
         fact about the user's life rather than a number the app invented —
         see "This Is Not A Game" in knowledge/project.md. -->
    <button class="chip kept-chip" id="keptChip" type="button" data-nav="progress" aria-label="Days kept">
      <i aria-hidden="true">KEPT</i><b>0</b>
    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<!-- `data-icon` names an entry in the icon table in `js/ui.js`, which paints it
     in on first render. The paths deliberately do NOT live here: the same five
     shapes inlined in two files is two copies to keep in step, and the copy in
     the shell is the one nobody would remember to update.

     Five tabs, not six. Rewards is the one screen you visit after the fact
     rather than to do something, so it moved to the top of More — see
     `renderMore()` — and the four daily screens each got a wider target. -->
<nav class="tabbar" id="tabbar" aria-label="Primary">
  <button type="button" data-nav="today"    data-icon="sun"      class="tab"><i>Today</i></button>
  <button type="button" data-nav="plan"     data-icon="calendar"  class="tab"><i>Plan</i></button>
  <button type="button" data-nav="read"     data-icon="book"     class="tab"><i>Read</i></button>
  <button type="button" data-nav="progress" data-icon="chart"    class="tab"><i>Stats</i></button>
  <button type="button" data-nav="more"     data-icon="grid"     class="tab"><i>More</i></button>
</nav>

<!-- bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">Title</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">✕</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script src="./js/data.js"></script>
<script src="./js/program.js"></script>
<script src="./js/goals.js"></script>
<script src="./js/run.js"></script>
<script src="./js/photos.js"></script>
<script src="./js/store.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
</body>
</html>

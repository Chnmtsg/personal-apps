<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arise — Personal Development Tracker</title>
<meta name="description" content="Set goals that progress from where you actually are to a target you choose, keep the streak, and write before you can call the reading done.">
<meta name="theme-color" content="#0e0d0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arise">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">↑</span>
    <span class="brand-text">Arise</span>
  </div>
  <div class="topbar-right">
    <!-- The label lives on the button, not the contents: render() rewrites the
         innerHTML of both chips, so a name inside them would not survive. -->
    <button class="chip streak-chip" id="streakChip" type="button" data-nav="progress" aria-label="Current streak">
      <span aria-hidden="true">🔥</span><b>0</b>
    </button>
    <!-- Days kept, not a rank. The top bar is permanent view, so it carries a
         fact about the user's life rather than a number the app invented —
         see "This Is Not A Game" in knowledge/project.md. -->
    <button class="chip kept-chip" id="keptChip" type="button" data-nav="progress" aria-label="Days kept">
      <span aria-hidden="true">✓</span><b>0</b>
    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Primary">
  <button type="button" data-nav="today"    class="tab"><span aria-hidden="true">🏠</span><i>Today</i></button>
  <button type="button" data-nav="plan"     class="tab"><span aria-hidden="true">🎯</span><i>Plan</i></button>
  <button type="button" data-nav="read"     class="tab"><span aria-hidden="true">📖</span><i>Read</i></button>
  <button type="button" data-nav="progress" class="tab"><span aria-hidden="true">📈</span><i>Stats</i></button>
  <button type="button" data-nav="rewards"  class="tab"><span aria-hidden="true">🏆</span><i>Rewards</i></button>
  <button type="button" data-nav="more"     class="tab"><span aria-hidden="true">⚙️</span><i>More</i></button>
</nav>

<!-- bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">Title</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">✕</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script src="./js/data.js"></script>
<script src="./js/program.js"></script>
<script src="./js/goals.js"></script>
<script src="./js/store.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
</body>
</html>

# Top 100 errors, machine-readable.
# Source: English–Mongolian Contrastive Guide §KK.
#
# tier: deterministic  -> catchable by regex, no LLM, zero hallucination risk
#       contextual     -> needs the corrector agent; used as retrieval few-shots
#       professional   -> mining/technical register, OUT OF SCOPE for the
#                         journaling app; keep for a later professional tier
#
# `find` / `replace` are Python re patterns, case-insensitive, applied only to
# tier: deterministic entries. Every one must be safe enough to fire without
# review — if a rule has any plausible false positive, demote it to contextual.

version: 1
source: "English–Mongolian Contrastive Guide, section KK"

patterns:

# ---------- Articles (1-12) ----------
# All contextual. Article choice depends on discourse state, which regex
# cannot see. These serve as few-shot examples for the corrector.

  - {id: 1,  cat: article, tier: contextual, wrong: "I am geologist.", right: "I am a geologist."}
  - {id: 2,  cat: article, tier: contextual, wrong: "She is engineer.", right: "She is an engineer."}
  - {id: 3,  cat: article, tier: contextual, wrong: "I work in mining industry.", right: "I work in the mining industry."}
  - {id: 4,  cat: article, tier: contextual, wrong: "We found new deposit.", right: "We found a new deposit."}
  - {id: 5,  cat: article, tier: contextual, wrong: "The deposit is in Gobi.", right: "The deposit is in the Gobi Desert."}
  - {id: 6,  cat: article, tier: deterministic, wrong: "I live in the Mongolia.", right: "I live in Mongolia.",
     find: '\bthe\s+(Mongolia|Ulaanbaatar|China|Russia|Japan|Korea|England)\b', replace: '\1'}
  - {id: 7,  cat: article, tier: deterministic, wrong: "He speaks the English.", right: "He speaks English.",
     find: '\bthe\s+(English|Mongolian|Chinese|Russian|Japanese)\b(?!\s+(language|word|teacher|class|test))', replace: '\1'}
  - {id: 8,  cat: article, tier: deterministic, wrong: "I go to the work at 8.", right: "I go to work at 8.",
     find: '\bto\s+the\s+(work|school|bed|home)\b', replace: 'to \1'}
  - {id: 9,  cat: article, tier: contextual, wrong: "The geology is interesting.", right: "Geology is interesting."}
  - {id: 10, cat: article, tier: deterministic, wrong: "It took a hour.", right: "It took an hour.",
     find: '\ba\s+(hour|honest|honour|heir)', replace: 'an \1'}
  - {id: 11, cat: article, tier: deterministic, wrong: "She is an university student.", right: "She is a university student.",
     find: '\ban\s+(university|user|European|one|uniform|unit)', replace: 'a \1'}
  - {id: 12, cat: article, tier: contextual, wrong: "I saw a rock. A rock was heavy.", right: "I saw a rock. The rock was heavy."}

# ---------- Nouns and number (13-22) ----------

  - {id: 13, cat: plural, tier: contextual, wrong: "three sample", right: "three samples"}
  - {id: 14, cat: countability, tier: deterministic, wrong: "many informations", right: "much information",
     find: '\b(many|few)\s+informations?\b', replace: 'much information'}
  - {id: 15, cat: countability, tier: deterministic, wrong: "new equipments", right: "new equipment",
     find: '\bequipments\b', replace: 'equipment'}
  - {id: 16, cat: countability, tier: deterministic, wrong: "He gave me an advice.", right: "He gave me a piece of advice.",
     find: '\ban\s+advice\b', replace: 'a piece of advice'}
  - {id: 17, cat: subject_verb_agreement, tier: deterministic, wrong: "The news are good.", right: "The news is good.",
     find: '\bnews\s+are\b', replace: 'news is'}
  - {id: 18, cat: countability, tier: deterministic, wrong: "I have many works.", right: "I have a lot of work.",
     find: '\bmany\s+works\b', replace: 'a lot of work'}
  - {id: 19, cat: countability, tier: contextual, wrong: "two researches", right: "two research projects"}
  - {id: 20, cat: countability, tier: deterministic, wrong: "The datas show", right: "The data show",
     find: '\bdatas\b', replace: 'data'}
  - {id: 21, cat: countability, tier: deterministic, wrong: "staffs were present", right: "staff were present",
     find: '\bstaffs\b', replace: 'staff'}
  - {id: 22, cat: countability, tier: deterministic, wrong: "evidences suggest", right: "evidence suggests",
     find: '\bevidences\b', replace: 'evidence'}

# ---------- Verbs and tense (23-40) ----------

  - {id: 23, cat: subject_verb_agreement, tier: contextual, wrong: "He work here.", right: "He works here."}
  - {id: 24, cat: subject_verb_agreement, tier: deterministic, wrong: "She don't know.", right: "She doesn't know.",
     find: '\b(he|she|it)\s+don.?t\b', replace: "\\1 doesn't"}
  - {id: 25, cat: verb_tense, tier: contextual, wrong: "I work here since 2019.", right: "I have worked here since 2019."}
  - {id: 26, cat: verb_form, tier: deterministic, wrong: "I am knowing the answer.", right: "I know the answer.",
     find: '\b(am|is|are)\s+(knowing|wanting|needing|liking|believing|understanding)\b', replace: '\2'}
  - {id: 27, cat: copula, tier: deterministic, wrong: "I am agree.", right: "I agree.",
     find: '\b(am|is|are)\s+agree\b', replace: 'agree'}
  - {id: 28, cat: copula, tier: contextual, wrong: "He is teacher.", right: "He is a teacher."}
  - {id: 29, cat: verb_tense, tier: contextual, wrong: "Yesterday I go to site.", right: "Yesterday I went to the site."}
  - {id: 30, cat: verb_form, tier: deterministic, wrong: "I have went there.", right: "I have gone there.",
     find: '\b(have|has|had)\s+went\b', replace: '\1 gone'}
  - {id: 31, cat: verb_form, tier: deterministic, wrong: "The report was wrote.", right: "The report was written.",
     find: '\b(was|were|been)\s+wrote\b', replace: '\1 written'}
  - {id: 32, cat: verb_form, tier: deterministic, wrong: "The accident was happened.", right: "The accident happened.",
     find: '\b(was|were)\s+(happened|occurred|arrived)\b', replace: '\2'}
  - {id: 33, cat: verb_form, tier: deterministic, wrong: "I didn't went.", right: "I didn't go.",
     find: "\\bdidn.?t\\s+(went|saw|came|took|made|got|had|did|ate|gave)\\b", replace: null,
     note: "needs lemma lookup; use an irregular-verb table, not a regex replace"}
  - {id: 34, cat: verb_form, tier: deterministic, wrong: "He can to swim.", right: "He can swim.",
     find: '\b(can|could|will|would|should|must|may|might)\s+to\s+([a-z]+)\b', replace: '\1 \2'}
  - {id: 35, cat: verb_form, tier: deterministic, wrong: "He cans drive.", right: "He can drive.",
     find: '\b(cans|musts|wills|shoulds)\b', replace: null,
     note: "strip the -s; map via table"}
  - {id: 36, cat: gerund_infinitive, tier: deterministic, wrong: "I enjoy to work here.", right: "I enjoy working here.",
     find: '\b(enjoy|finish|avoid|mind|suggest|practise|practice|consider)\s+to\s+([a-z]+)\b', replace: null,
     note: "verb + -ing required; needs -ing form, use a lemma table"}
  - {id: 37, cat: gerund_infinitive, tier: deterministic, wrong: "I look forward to hear.", right: "I look forward to hearing.",
     find: '\blook(ing)?\s+forward\s+to\s+([a-z]+?)(?<!ing)\b', replace: null,
     note: "after 'to' as preposition -> -ing"}
  - {id: 38, cat: verb_form, tier: contextual, wrong: "He suggested me to go.", right: "He suggested that I go."}
  - {id: 39, cat: conditional, tier: deterministic, wrong: "If it will rain, we stop.", right: "If it rains, we will stop.",
     find: '\bif\s+\w+\s+will\s+', replace: null,
     note: "first conditional: no will in the if-clause"}
  - {id: 40, cat: word_choice, tier: deterministic, wrong: "I am interesting in geology.", right: "I am interested in geology.",
     find: '\b(am|is|are|was|were)\s+(interesting|boring|exciting|surprising|confusing)\s+in\b', replace: null,
     note: "-ing describes the thing, -ed describes the person"}

# ---------- Word order (41-48) ----------

  - {id: 41, cat: word_order, tier: contextual, wrong: "I the samples analysed.", right: "I analysed the samples."}
  - {id: 42, cat: word_order, tier: contextual, wrong: "He examined carefully the core.", right: "He examined the core carefully."}
  - {id: 43, cat: word_order, tier: contextual, wrong: "We drilled last week three holes.", right: "We drilled three holes last week."}
  - {id: 44, cat: relative_clause, tier: contextual, wrong: "The yesterday drilled hole", right: "the hole we drilled yesterday"}
  - {id: 45, cat: word_order, tier: contextual, wrong: "a wooden black old box", right: "an old black wooden box",
     note: "adjective order: opinion, size, age, shape, colour, origin, material"}
  - {id: 46, cat: word_order, tier: deterministic, wrong: "I always am careful.", right: "I am always careful.",
     find: '\b(always|never|often|usually|sometimes|already)\s+(am|is|are|was|were)\b', replace: '\2 \1'}
  - {id: 47, cat: word_order, tier: deterministic, wrong: "Always I check the data.", right: "I always check the data.",
     find: '^(Always|Never|Often|Usually)\s+(I|you|we|they|he|she)\s+', replace: null}
  - {id: 48, cat: word_choice, tier: deterministic, wrong: "Very I like it.", right: "I like it very much.",
     find: '^Very\s+I\s+', replace: null}

# ---------- Prepositions (49-62) ----------
# The densest deterministic block. These are fixed lexical pairings with almost
# no false-positive risk.

  - {id: 49, cat: word_order, tier: contextual, wrong: "About the report, it's late.", right: "The report is late.",
     note: "direct calque of the postposition тухай"}
  - {id: 50, cat: preposition, tier: deterministic, wrong: "We arrived to the site.", right: "We arrived at the site.",
     find: '\barriv(e|ed|ing)\s+to\b', replace: 'arriv\1 at'}
  - {id: 51, cat: preposition, tier: deterministic, wrong: "Let's discuss about it.", right: "Let's discuss it.",
     find: '\bdiscuss(ed|ing|es)?\s+about\b', replace: 'discuss\1'}
  - {id: 52, cat: preposition, tier: deterministic, wrong: "Explain me the data.", right: "Explain the data to me.",
     find: '\b(explain|describe|suggest|mention)\s+(me|us|him|her|them)\b', replace: null,
     note: "these verbs need 'to' before the person; reorder"}
  - {id: 53, cat: preposition, tier: deterministic, wrong: "It depends of the grade.", right: "It depends on the grade.",
     find: '\bdepend(s|ed|ing)?\s+of\b', replace: 'depend\1 on'}
  - {id: 54, cat: preposition, tier: deterministic, wrong: "I listen music.", right: "I listen to music.",
     find: '\blisten(s|ed|ing)?\s+(?!to\b)(music|radio|him|her|me|them|it)\b', replace: 'listen\1 to \2'}
  - {id: 55, cat: preposition, tier: deterministic, wrong: "She is married with him.", right: "She is married to him.",
     find: '\bmarried\s+with\b', replace: 'married to'}
  - {id: 56, cat: preposition, tier: deterministic, wrong: "in the internet", right: "on the internet",
     find: '\bin\s+the\s+internet\b', replace: 'on the internet'}
  - {id: 57, cat: preposition, tier: deterministic, wrong: "I'm good in English.", right: "I'm good at English.",
     find: '\bgood\s+in\s+(English|maths?|science|sports?|cooking|drawing)\b', replace: 'good at \1'}
  - {id: 58, cat: preposition, tier: deterministic, wrong: "different than", right: "different from",
     find: '\bdifferent\s+than\b', replace: 'different from'}
  - {id: 59, cat: preposition, tier: deterministic, wrong: "consist in three units", right: "consist of three units",
     find: '\bconsist(s|ed|ing)?\s+in\b', replace: 'consist\1 of'}
  - {id: 60, cat: preposition, tier: deterministic, wrong: "responsible of safety", right: "responsible for safety",
     find: '\bresponsible\s+of\b', replace: 'responsible for'}
  - {id: 61, cat: preposition, tier: deterministic, wrong: "on July", right: "in July",
     find: '\bon\s+(January|February|March|April|May|June|July|August|September|October|November|December)\b(?!\s+\d)', replace: 'in \1'}
  - {id: 62, cat: preposition, tier: deterministic, wrong: "enter into the room", right: "enter the room",
     find: '\benter(s|ed|ing)?\s+into\s+the\b', replace: 'enter\1 the'}

# ---------- Pronouns and determiners (63-70) ----------

  - {id: 63, cat: pronoun, tier: contextual, wrong: "My wife, he works...", right: "My wife, she works...",
     note: "highest-value contextual check; тэр covers he/she/it. Needs coreference, not regex."}
  - {id: 64, cat: spelling, tier: deterministic, wrong: "Its ready.", right: "It's ready.",
     find: '\bIts\s+(ready|good|fine|late|ok|okay|nice|cold|hot|true)\b', replace: "It's \\1"}
  - {id: 65, cat: possessive, tier: deterministic, wrong: "the deposit and it's grade", right: "the deposit and its grade",
     find: "\\bit's\\s+(grade|name|size|colour|color|price|value|quality|shape)\\b", replace: 'its \1'}
  - {id: 66, cat: possessive, tier: deterministic, wrong: "the my report", right: "my report",
     find: '\bthe\s+(my|your|his|her|our|their)\b', replace: '\1'}
  - {id: 67, cat: possessive, tier: deterministic, wrong: "a my friend", right: "a friend of mine",
     find: '\ba\s+my\s+(\w+)\b', replace: 'a \1 of mine'}
  - {id: 68, cat: word_choice, tier: deterministic, wrong: "another samples", right: "other samples",
     find: '\banother\s+(\w+s)\b', replace: 'other \1'}
  - {id: 69, cat: subject_verb_agreement, tier: deterministic, wrong: "Every students know.", right: "Every student knows.",
     find: '\b(every|each)\s+(\w+)s\s+', replace: null,
     note: "every/each takes a singular noun and singular verb"}
  - {id: 70, cat: extra_word, tier: deterministic, wrong: "I have somes.", right: "I have some.",
     find: '\b(somes|anys|everys|manys|muchs)\b', replace: null}

# ---------- Questions and negation (71-76) ----------

  - {id: 71, cat: question_form, tier: contextual, wrong: "Where you work?", right: "Where do you work?"}
  - {id: 72, cat: question_form, tier: contextual, wrong: "You work here?", right: "Do you work here?"}
  - {id: 73, cat: question_form, tier: deterministic, wrong: "Does she works here?", right: "Does she work here?",
     find: '\b(does|do|did)\s+(he|she|it|you|we|they|\w+)\s+(\w+)s\b', replace: null,
     note: "after do-support the verb is bare"}
  - {id: 74, cat: question_form, tier: contextual, wrong: "He asked where did I work.", right: "He asked where I worked.",
     note: "reported questions do not invert"}
  - {id: 75, cat: question_form, tier: deterministic, wrong: "I no have time.", right: "I don't have time.",
     find: '\b(I|you|we|they)\s+no\s+(have|want|know|like|need)\b', replace: null}
  - {id: 76, cat: word_choice, tier: deterministic, wrong: "I don't have no samples.", right: "I don't have any samples.",
     find: "\\b(don't|doesn't|didn't|can't|won't)\\s+(\\w+)\\s+no\\b", replace: '\1 \2 any'}

# ---------- Sentence structure and punctuation (77-84) ----------

  - {id: 77, cat: run_on, tier: contextual, wrong: "I'm tired, I'll stop.", right: "I'm tired. I'll stop.",
     note: "comma splice; very common and worth catching"}
  - {id: 78, cat: punctuation, tier: contextual, wrong: "The samples, were analysed.", right: "The samples were analysed."}
  - {id: 79, cat: capitalisation, tier: deterministic, wrong: "i am a geologist", right: "I am a geologist",
     find: '\bi\b', replace: 'I'}
  - {id: 80, cat: capitalisation, tier: deterministic, wrong: "I speak english.", right: "I speak English.",
     find: '\b(english|mongolian|chinese|russian|japanese|korean|monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|june|july|august|september|october|november|december)\b',
     replace: null, note: "capitalise; case-sensitive match required"}
  - {id: 81, cat: run_on, tier: contextual, wrong: "Because it was late.", right: "We stopped because it was late.",
     note: "sentence fragment"}
  - {id: 82, cat: register, tier: deterministic, wrong: "And I want to add...", right: "In addition, ...",
     find: '^(And|But|So)\s+', replace: null, note: "informal sentence opener; flag only at B2+"}
  - {id: 83, cat: plural, tier: deterministic, wrong: "a 500-metres hole", right: "a 500-metre hole",
     find: '\b(\d+)-(metres|meters|kilometres|kilometers|years|days|hours|minutes)\s+', replace: null,
     note: "compound modifiers take the singular"}
  - {id: 84, cat: possessive, tier: contextual, wrong: "sample's (plural)", right: "samples",
     note: "greengrocer's apostrophe"}

# ---------- Vocabulary and collocation (85-94) ----------
# Nearly all deterministic. High-confidence, high-frequency, zero-cost wins.

  - {id: 85, cat: collocation, tier: deterministic, wrong: "do a decision", right: "make a decision",
     find: '\bdo(es|ing|ne)?\s+(a\s+)?(decision|mistake|plan|choice|promise|noise|progress)\b', replace: null}
  - {id: 86, cat: collocation, tier: deterministic, wrong: "make research", right: "do research",
     find: '\bmak(e|es|ing)\s+(research|homework|exercise|business|the dishes)\b', replace: null}
  - {id: 87, cat: collocation, tier: deterministic, wrong: "open the light", right: "turn on the light",
     find: '\bopen\s+the\s+(light|lights|TV|television|radio|computer)\b', replace: 'turn on the \1'}
  - {id: 88, cat: word_choice, tier: deterministic, wrong: "say me the results", right: "tell me the results",
     find: '\bsay\s+(me|him|her|us|them)\b', replace: 'tell \1'}
  - {id: 89, cat: word_choice, tier: deterministic, wrong: "learn me English", right: "teach me English",
     find: '\blearn\s+(me|him|her|us|them)\b', replace: 'teach \1'}
  - {id: 90, cat: word_choice, tier: deterministic, wrong: "I can talk but not good.", right: "I can talk but not well.",
     find: '\b(speak|talk|write|work|sing|play|do)\s+good\b', replace: '\1 well'}
  - {id: 91, cat: collocation, tier: deterministic, wrong: "strong rain", right: "heavy rain",
     find: '\bstrong\s+(rain|snow|traffic|smoker)\b', replace: 'heavy \1'}
  - {id: 92, cat: register, tier: contextual, wrong: "big difference (technical)", right: "significant difference"}
  - {id: 93, cat: word_order, tier: deterministic, wrong: "turn on it", right: "turn it on",
     find: '\bturn\s+(on|off)\s+(it|them|him|her)\b', replace: 'turn \2 \1',
     note: "separable phrasal verbs: pronoun object goes in the middle"}
  - {id: 94, cat: word_order, tier: contextual, wrong: "look the samples after", right: "look after the samples",
     note: "inseparable phrasal verb split by SOV instinct"}

# ---------- Register and style (95-100) ----------
# 95-98 belong to a B2+ tier. 99-100 are professional and must NOT appear in a
# beginner journaling app.

  - {id: 95, cat: register, tier: contextual, wrong: "I want the report.", right: "I'd like the report.",
     note: "politeness; see guide section 1.4 — directness reads as rude in English"}
  - {id: 96, cat: register, tier: contextual, wrong: "Send me the data.", right: "Could you send me the data?"}
  - {id: 97, cat: register, tier: professional, wrong: "We got a lot of samples.", right: "We obtained a substantial number of samples."}
  - {id: 98, cat: register, tier: professional, wrong: "This proves the model.", right: "This suggests the model is correct.",
     note: "academic hedging"}
  - {id: 99, cat: register, tier: professional, wrong: "The ore is 200 Mt.", right: "The mineralisation is 200 Mt.",
     note: "regulatory, not linguistic. Out of scope for the journal app."}
  - {id: 100, cat: register, tier: professional, wrong: "We have 50 Mt of reserves.", right: "We have 50 Mt of Mineral Resources.",
     note: "regulatory, not linguistic. Out of scope for the journal app."}

# Error taxonomy v2 — grounded in the English–Mongolian Contrastive Guide.
#
# What changed from v1: the l1_note fields are no longer my inference from
# typology. They come from the guide, which means they are checkable, and the
# `bridge` field is new — it is what the guide gives you that a grammar
# reference does not: the thing in Mongolian that the learner ALREADY has,
# which the English form can be attached to.
#
# A bridge beats a rule. "English needs an article here" is a demand.
# "You already mark this with -ыг; English uses a separate word instead" is
# an explanation. Adults learn far faster from the second.

version: 2
l1: mongolian
source: "English–Mongolian Contrastive Guide (Vol 1 §1.2–1.3, Vol 3, §KK)"

categories:

  - id: article
    label: Articles (a / an / the)
    severity_default: noticeable
    priority: 1
    guide_ref: "§1.3.2, §M"
    rule_a2: "English needs a small word before a noun: 'a' for any one, 'the' for the one we both know."
    rule_b1: "Use a/an to introduce something new; use the once the reader knows which one you mean."
    l1_note: "Mongolian has no articles. The guide calls this the biggest single enemy."
    bridge: >
      Mongolian DOES mark definiteness — the accusative -ыг / -ийг goes on
      specific objects, and indefinite ones stay bare. The concept is already
      there. English just uses a separate word instead of a suffix.
    teaching_note: "Errors 1-12 in the checklist. Highest-value single category to fix."

  - id: copula
    label: Missing 'to be'
    severity_default: noticeable
    priority: 2
    guide_ref: "§1.3.7"
    rule_a2: "English needs am, is, or are before an adjective or a noun: I am tired."
    l1_note: "Mongolian omits the linking verb. 'Би геологич' is literally 'I geologist'."
    bridge: >
      Use the guide's day-one sentence: Би геологич -> I am a geologist.
      Four words, two things English forces you to add that Mongolian does not.
      If the learner internalises this one sentence, two whole categories move.
    teaching_note: "Pairs with article. Often the same edit fires both."

  - id: subject_verb_agreement
    label: Subject-verb agreement (-s)
    severity_default: noticeable
    priority: 3
    guide_ref: "§1.3.5"
    rule_a2: "With he, she, or it, add -s to the verb: he works, she goes."
    l1_note: "Mongolian verbs change for tense and mood but never for person, so the -s carries no information a Mongolian speaker expects to need."
    bridge: >
      Name the redundancy openly. English repeats information the sentence
      already has. Arguing with it wastes energy; it has to become reflex.
    teaching_note: "The guide notes this is the most common error in English learning worldwide."

  - id: pronoun
    label: He / she
    severity_default: blocking
    priority: 4
    guide_ref: "§1.3.4"
    rule_a2: "English uses he for a man and she for a woman. The reader cannot follow your story if these swap."
    l1_note: "Mongolian «тэр» covers he, she, it and that. English forces a gender choice every single time."
    bridge: >
      The guide's key insight: this is a SPEED problem, not a knowledge problem.
      Learners know the rule and still fail under time pressure. Do not
      re-explain the rule when this fires — the learner already knows it.
      Give a timed drill instead.
    teaching_note: "Mark blocking. A swapped pronoun genuinely confuses a reader."

  - id: preposition
    label: Prepositions
    severity_default: noticeable
    priority: 5
    guide_ref: "§1.3.3, §R"
    rule_a2: "In English these small words come BEFORE the noun: in the mine, on the table."
    l1_note: "Mongolian uses postpositions — уурхайд is literally 'mine-in'. The word exists; the position is reversed."
    bridge: >
      Physical drill from the guide: noun on one card, preposition on another,
      have the learner swap them by hand. Motor memory beats explanation here.
      Also the source of 'About the report, it is late' — тухай translated in
      its Mongolian position.
    teaching_note: "13 of the top 100. Most are fixed lexical pairs, so most are catchable by rule."

  - id: verb_tense
    label: Verb tense, incl. present perfect
    severity_default: noticeable
    priority: 6
    guide_ref: "§1.3.8, §D"
    rule_a2: "Finished past actions use the past form: go becomes went."
    rule_b1: "Present perfect connects a past action to now. Past simple is a finished, disconnected event."
    l1_note: "Mongolian has no direct present-perfect equivalent, producing 'I work here since 2019'."
    bridge: >
      The guide's timeline image: past simple is a DOT in the past; present
      perfect is an ARROW from the past touching today. Then teach the trigger
      words — since, for, already, yet, just, ever, never — which the guide
      says cover about 80% of correct usage.

  - id: word_order
    label: Word order
    severity_default: blocking
    priority: 7
    guide_ref: "§1.3.1, §T"
    rule_a2: "English order is subject, verb, object: I read a book."
    l1_note: "Mongolian is strictly SOV and head-final. The verb drifts to the end, and errors increase with sentence length."
    bridge: >
      Head-final vs head-initial is the deepest difference in the guide's
      master table. Expect word-order errors to RISE as the learner's
      ambition rises — a sudden increase is often a sign of progress, not
      regression. Do not penalise it in the level estimate.

  - id: plural
    label: Plural -s
    severity_default: minor
    priority: 8
    guide_ref: "§1.3.6"
    rule_a2: "After a number greater than one, English nouns add -s: three samples."
    l1_note: "Mongolian plural marking is optional and usually dropped after a numeral, since the number already carries it."
    bridge: >
      The guide's line, said plainly: English repeats itself, this is not
      logical, accept it. Learners argue with redundancy because their
      language avoids it. Naming the illogic ends the argument faster than
      defending it.

  - id: question_form
    label: Question form (do-support)
    severity_default: noticeable
    priority: 9
    guide_ref: "§E"
    rule_a2: "English questions put a helping verb first: Do you like coffee?"
    l1_note: "Mongolian forms questions with a particle and no reordering, so learners produce statement-shaped questions."
    bridge: "The guide calls do-support the strangest thing in English. Treat it as an arbitrary ritual to memorise, not a logic to derive."

  - id: countability
    label: Countable / uncountable
    severity_default: minor
    priority: 10
    guide_ref: "§N"
    rule_b1: "Some nouns cannot be counted: much information, not many informations."
    l1_note: "Mongolian does not draw this line the same way, so English uncountables feel arbitrary."
    bridge: "Teach as a closed trap list, not a rule: information, equipment, advice, news, research, staff, evidence, data, work."

  - id: relative_clause
    label: Relative clauses
    severity_default: noticeable
    priority: 11
    guide_ref: "§1.3.9, §V"
    rule_b1: "The describing part comes AFTER the noun: the hole that we drilled yesterday."
    l1_note: "Mongolian puts the description before the noun, producing front-loaded phrases like 'the yesterday drilled hole'."
    bridge: >
      Build from two simple sentences, never show the finished form first.
      'I saw a hole. We drilled the hole yesterday.' -> 'I saw the hole that
      we drilled yesterday.'

  - id: gerund_infinitive
    label: -ing vs to
    severity_default: noticeable
    priority: 12
    guide_ref: "§O"
    rule_b1: "After a preposition, always use -ing: I look forward to hearing from you."
    l1_note: "No equivalent distinction, so the choice looks random."
    bridge: "The guide's one reliable rule: after a preposition -> always -ing. Everything else is a memorised verb list."

  - id: collocation
    label: Collocation
    severity_default: noticeable
    priority: 13
    guide_ref: "§Q"
    rule_a2: "These words go together in English. Learn them as one block, not as separate words."
    bridge: "make vs do is the highest-frequency pair. Teach collocations as whole chunks; single-word translation is what produces 'do a decision'."

  - id: verb_form
    label: Verb form
    severity_default: noticeable
    priority: 14
    guide_ref: "§KK 30-38"
    rule_a2: "After to and after helping verbs, use the base form: I can swim, I want to go."

  - id: word_choice
    label: Word choice
    severity_default: noticeable
    priority: 15
    rule_a2: "This word exists, but it is not the one English uses here."

  - id: conditional
    label: Conditionals
    severity_default: noticeable
    priority: 16
    guide_ref: "§S"
    rule_b1: "If + present, will + base: If it rains, I will stay home. Never 'will' in the if-part."

  - id: possessive
    label: Possessive
    severity_default: minor
    priority: 17
    rule_a2: "Show belonging with 's: my mother's birthday. Note 'its' has no apostrophe."

  - id: run_on
    label: Run-on / fragment
    severity_default: noticeable
    priority: 18
    rule_b1: "Two complete sentences need a full stop or a joining word, not a comma."

  - id: capitalisation
    label: Capital letters
    severity_default: minor
    priority: 19
    rule_a2: "Names, countries, languages, months and days always take a capital. So does I."

  - id: spelling
    label: Spelling
    severity_default: minor
    priority: 20
    guide_ref: "§1.3.12, §L"
    l1_note: "Mongolian Cyrillic is nearly 1:1 sound to letter. English is not, so spelling cannot be derived from pronunciation."
    bridge: >
      The guide's absolute rule: never let a learner meet a written word
      without its audio. In Mongolian, spelling gives the sound for free.
      In English it does not. Product consequence — every new word surfaced
      by this app should ship with audio.

  - id: punctuation
    label: Punctuation
    severity_default: minor
    priority: 21
    guide_ref: "§Z"

  - id: register
    label: Register and politeness
    severity_default: noticeable
    priority: 22
    guide_ref: "§1.4"
    rule_b1: "English softens requests. 'I want' sounds blunt; 'I'd like' or 'Could you' is normal."
    l1_note: "Mongolian carries politeness in verb morphology. English carries it in modal verbs, so direct translation reads as rude."
    bridge: >
      The guide's framing: modals ARE the English politeness system. A learner
      being blunt is not being rude — they are missing a grammatical channel
      their own language handles elsewhere.
    gate: "B1+. Do not raise register with beginners; it is not an error, it is a next stage."

  - id: missing_word
    label: Missing word
    severity_default: blocking
    priority: 23

  - id: extra_word
    label: Extra word
    severity_default: minor
    priority: 24

  - id: other
    label: Other
    severity_default: minor
    priority: 99


# Not errors. Never counted, never drilled, never affects the level estimate.
fluency_types: [collocation_style, register_style, translated_idiom, wordiness]

# Out of scope for the journaling app. Keep for a professional tier.
excluded_from_journal_app:
  - "§KK 97-100 — academic hedging and JORC / NI 43-101 resource terminology"
  - "Pronunciation (§1.5-1.7) — needs audio input, not text"

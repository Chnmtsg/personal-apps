<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: without it Android keeps the layout viewport at
         full height behind the on-screen keyboard, so on the Write screen the
         word count and the Analyse button sit under the keyboard — on the one
         screen where typing and the 30-word gate are used together. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#faf8f3" />
    <!-- iOS never reads the manifest's `icons` for the home screen. Without
         this link it screenshots the page and uses that as the icon, so an
         installed app shows a thumbnail of whatever screen was open. -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!-- Safari has read the manifest's `display` since 15.4, but this is what
         older iOS honours and it costs nothing to keep. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`: translucent puts the page under
         the status bar, and nothing here pads for safe-area-inset-top — the
         bottom inset is handled in App.tsx, the top is not. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English Feedback" />
    <title>English Feedback</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
